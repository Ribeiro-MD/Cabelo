<style>
  :root {
    --bg: #08060a;
    --bg2: #110e12;
    --card: #16121a;
    --line: rgba(212,168,90,.18);
    --gold: #d4a85a;
    --gold-hi: #f3d68e;
    --gold-lo: #9c6b22;
    --grad: linear-gradient(120deg, #9c6b22 0%, #e8c374 35%, #f6dfa0 50%, #c8913c 70%, #9c6b22 100%);
    --text: #efe6d6;
    --muted: #a3988a;
    --ok: #6fcf97;
    --bad: #e07a6f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: "Josefin Sans", system-ui, sans-serif; font-weight: 300; background: var(--bg); color: var(--text); line-height: 1.7; }
  h1, h2, h3 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; line-height: 1.1; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 22px; }
  .gold { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .script { font-family: "Great Vibes", cursive; font-weight: 400; }

  /* textura de pontos dourados, inspirada no logo */
  .dust {
    background-image:
      radial-gradient(circle at 20% 30%, rgba(212,168,90,.35) 0 1.2px, transparent 1.6px),
      radial-gradient(circle at 70% 60%, rgba(243,214,142,.25) 0 1px, transparent 1.4px),
      radial-gradient(circle at 40% 80%, rgba(156,107,34,.35) 0 1.4px, transparent 1.8px);
    background-size: 46px 46px, 63px 63px, 81px 81px;
  }

  nav { position: sticky; top: 0; z-index: 20; background: rgba(8,6,10,.88); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 46px; height: 46px; border-radius: 50%; }
  .brand span { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); }
  .nav-r { display: flex; gap: 24px; align-items: center; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  .nav-r a:not(.btn):hover { color: var(--gold-hi); }
  .lang { background: transparent; border: 1px solid var(--line); color: var(--gold); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 12px; letter-spacing: 2px; cursor: pointer; }
  .lang:hover { border-color: var(--gold); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 28px; border-radius: 999px; font: inherit; font-weight: 600; font-size: 13px;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer; border: 0; min-height: 50px;
    transition: transform .15s, box-shadow .2s, background .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn svg { width: 18px; height: 18px; }
  .btn-gold { background: var(--grad); color: #1a1206; box-shadow: 0 10px 34px rgba(212,168,90,.25); }
  .btn-gold:hover { box-shadow: 0 14px 40px rgba(212,168,90,.4); }
  .btn-line { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
  .btn-line:hover { background: rgba(212,168,90,.08); }
  .btn-wa { background: #25d366; color: #0b2e17; }

  /* hero */
  .hero { position: relative; padding: 80px 0 100px; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0; opacity: .35; }
  .hero .wrap { position: relative; display: grid; grid-template-columns: 1.05fr 1fr; gap: 60px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-size: 14px; color: var(--muted); }
  .stars { color: var(--gold); letter-spacing: 2px; }
  .pill b { color: var(--text); font-weight: 600; }
  .hero h1 { font-size: clamp(46px, 6.6vw, 80px); margin: 22px 0 18px; }
  .hero h1 .script { font-size: 1.25em; display: inline-block; line-height: 1.15; padding: 0 .08em .12em 0; }
  .lead { font-size: 18px; color: var(--muted); max-width: 500px; margin-bottom: 32px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .status { margin-top: 26px; display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.open { background: var(--ok); box-shadow: 0 0 0 4px rgba(111,207,151,.15); }
  .dot.closed { background: var(--bad); }
  .appt { margin-top: 10px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }

  .logo-big { position: relative; width: min(460px, 100%); margin: 0 auto; aspect-ratio: 1; }
  .logo-big img { width: 100%; height: 100%; border-radius: 50%; display: block; animation: glow 6s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 0 rgba(212,168,90,0)); }
    50% { filter: drop-shadow(0 0 30px rgba(212,168,90,.25)); }
  }

  .divider { display: flex; align-items: center; justify-content: center; gap: 16px; color: var(--gold); margin: 0 auto; }
  .divider::before, .divider::after { content: ""; height: 1px; width: 80px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .divider::after { transform: scaleX(-1); }

  section { padding: 100px 0; }
  .alt { background: var(--bg2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .head { text-align: center; max-width: 640px; margin: 0 auto 54px; }
  .kicker { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); }
  h2 { font-size: clamp(36px, 5vw, 56px); margin: 10px 0 14px; }
  .head p { color: var(--muted); }

  .services { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .svc { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 26px; transition: border-color .25s, transform .25s; }
  .svc:hover { border-color: var(--gold); transform: translateY(-4px); }
  .svc .ic { width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--gold); color: var(--gold); display: grid; place-items: center; margin-bottom: 18px; }
  .svc .ic svg { width: 30px; height: 30px; }
  .svc h3 { font-size: 28px; margin-bottom: 10px; }
  .svc ul { list-style: none; color: var(--muted); font-size: 15px; }
  .svc li { padding: 4px 0; border-bottom: 1px dashed rgba(212,168,90,.1); }
  .svc li:last-child { border: 0; }

  .team { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; }
  .member { text-align: center; }
  .av { width: 180px; aspect-ratio: 1; border-radius: 50%; margin: 0 auto 18px; padding: 4px; background: var(--grad); }
  .av div { width: 100%; height: 100%; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-family: "Great Vibes"; font-size: 64px; color: var(--gold); }
  .member h3 { font-size: 28px; }
  .member p { color: var(--muted); font-size: 14px; letter-spacing: 1px; }

  .why { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .why > div { background: var(--bg); padding: 34px 28px; }
  .why .n { font-family: "Cormorant Garamond"; font-size: 40px; line-height: 1; margin-bottom: 12px; }
  .why h3 { font-size: 24px; margin-bottom: 6px; }
  .why p { color: var(--muted); font-size: 15px; }

  .quotes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .quote { border: 1px solid var(--line); border-radius: 20px; padding: 32px; text-align: center; background: var(--card); }
  .quote p { font-family: "Cormorant Garamond"; font-style: italic; font-size: 22px; margin: 14px 0; }
  .quote small { color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  .center { text-align: center; margin-top: 28px; }
  .more { color: var(--gold); font-size: 14px; letter-spacing: 1px; }
  .more:hover { color: var(--gold-hi); }

  /* marcação */
  .book { position: relative; border: 1px solid var(--gold); border-radius: 30px; padding: 60px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: center; }
  .book::before { content: ""; position: absolute; inset: 0; opacity: .25; z-index: 0; }
  .book > * { position: relative; z-index: 1; }
  .book p { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 999px; padding: 10px 18px; font: inherit; font-size: 14px; cursor: pointer; transition: all .2s; }
  .chip:hover { border-color: var(--gold); }
  .chip.on { background: var(--grad); color: #1a1206; border-color: transparent; font-weight: 600; }
  .book .btn { width: 100%; }

  /* visitar */
  .visit { display: grid; grid-template-columns: 1fr 1.2fr; gap: 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 12px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; color: var(--muted); }
  tr.today td { color: var(--gold-hi); }
  tr.today td:last-child { color: var(--gold-hi); }
  .addr { margin: 22px 0; color: var(--muted); }
  .addr b { display: block; color: var(--text); font-weight: 400; }
  .map { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); min-height: 400px; }
  .map iframe { width: 100%; height: 100%; min-height: 400px; border: 0; filter: grayscale(1) invert(.92) sepia(.25) contrast(.9); }

  .socials { display: flex; gap: 12px; margin-top: 18px; }
  .socials a { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--gold); transition: border-color .2s, background .2s; }
  .socials a:hover { border-color: var(--gold); background: rgba(212,168,90,.08); }
  .socials svg { width: 20px; height: 20px; }

  footer { padding: 60px 0 120px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 14px; }
  footer img { width: 110px; height: 110px; border-radius: 50%; margin-bottom: 18px; }
  footer .socials { justify-content: center; margin: 18px 0; }
  footer a:hover { color: var(--gold-hi); }

  .mobile-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: rgba(8,6,10,.96); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 10px; }
  .mobile-bar .btn { flex: 1; padding: 12px; }

  @media (max-width: 1000px) {
    .services, .why { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 860px) {
    .hero .wrap, .visit, .book { grid-template-columns: 1fr; }
    .hero { padding: 50px 0 70px; }
    .hero .logo-big { order: -1; width: 260px; }
    .nav-r a:not(.btn) { display: none; }
    .nav-book { display: none !important; }
    .brand span { display: none; }
    .book { padding: 36px 24px; }
    section { padding: 70px 0; }
    .mobile-bar { display: flex; }
  }
  @media (max-width: 600px) {
    section { padding: 56px 0; }
    .head { margin-bottom: 30px; }
    h2 { font-size: 34px; }
    .divider::before, .divider::after { width: 40px; }

    .hero { padding: 28px 0 56px; text-align: center; }
    .hero .wrap { gap: 22px; }
    .hero .logo-big { width: 190px; }
    .hero h1 { font-size: 40px; margin: 16px 0 14px; }
    .lead { font-size: 16px; margin: 0 auto 24px; }
    .cta { flex-direction: column; }
    .cta .btn { width: 100%; }
    .status { justify-content: center; }
    .pill { font-size: 13px; padding: 6px 12px; }

    .services { gap: 10px; }
    .svc { padding: 18px 14px; border-radius: 16px; }
    .svc .ic { width: 44px; height: 44px; margin-bottom: 10px; }
    .svc .ic svg { width: 22px; height: 22px; }
    .svc h3 { font-size: 22px; margin-bottom: 4px; }
    .svc ul { font-size: 13px; line-height: 1.45; }
    .svc li { padding: 3px 0; }

    .team { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .av { width: 88px; padding: 3px; margin-bottom: 10px; }
    .av div { font-size: 38px; }
    .member h3 { font-size: 21px; }
    .member p { font-size: 12px; line-height: 1.35; letter-spacing: 0; }

    .why > div { padding: 20px 16px; }
    .why .n { font-size: 30px; margin-bottom: 6px; }
    .why h3 { font-size: 19px; }
    .why p { font-size: 13px; line-height: 1.5; }

    .quotes { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin: 0 -22px; padding: 0 22px 8px; scrollbar-width: none; }
    .quotes::-webkit-scrollbar { display: none; }
    .quote { flex: 0 0 82%; scroll-snap-align: center; padding: 24px; }
    .quote p { font-size: 19px; }

    .book { padding: 28px 20px; gap: 22px; border-radius: 22px; text-align: center; }
    .chips { justify-content: center; }
    .chip { padding: 8px 14px; font-size: 13px; }

    footer { padding: 40px 0 100px; }
    footer img { width: 84px; height: 84px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>

// minutos desde a meia-noite; 0 = domingo
const HOURS = {
  0: [], 1: [[570, 1080]], 2: [[570, 1080]], 3: [[570, 1080]],
  4: [[540, 1080]], 5: [[570, 1080]], 6: [[540, 840]]
};

let lang = "pt";
const chosen = new Set();
try { lang = localStorage.getItem("phb-lang") || "pt"; } catch (e) {}

const fmt = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");

function lisbonNow() {
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Lisbon", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  return { day: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(get("weekday")), min: (+get("hour") % 24) * 60 + +get("minute") };
}

function renderStatus() {
  const t = T[lang];
  const { day, min } = lisbonNow();
  const dot = document.getElementById("statusDot");
  const txt = document.getElementById("statusText");
  const slot = HOURS[day].find(([a, b]) => min >= a && min < b);
  if (slot) {
    dot.className = "dot open";
    txt.textContent = t.open + t.closesAt.replace("{h}", fmt(slot[1]));
    return;
  }
  for (let i = 0; i < 8; i++) {
    const d = (day + i) % 7;
    const next = HOURS[d].find(([a]) => i > 0 || a > min);
    if (next) {
      dot.className = "dot closed";
      txt.textContent = t.closedOpens.replace("{d}", i === 0 ? t.today : t.days[d].toLowerCase()).replace("{h}", fmt(next[0]));
      return;
    }
  }
}

function waLink(extra) {
  const t = T[lang];
  return `https://wa.me/${PHONE}?text=` + encodeURIComponent(t.waMsg + (extra ? t.waFor + extra : "") + ".");
}

function updateBook() {
  const t = T[lang];
  document.getElementById("bookBtn").href = waLink(t.chips.filter((_, i) => chosen.has(i)).join(", "));
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t[el.dataset.i18nHtml]);

  document.getElementById("servicesGrid").innerHTML = t.services.map(([ic, title, items]) => `
    <div class="svc">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[ic]}</svg></div>
      <h3>${title}</h3><ul>${items.map(x => `<li>${x}</li>`).join("")}</ul>
    </div>`).join("");

  document.getElementById("teamGrid").innerHTML = t.team.map(([name, role]) => `
    <div class="member"><div class="av"><div>${name[0]}</div></div><h3>${name}</h3><p>${role}</p></div>`).join("");


  document.getElementById("chips").innerHTML = t.chips.map((c, i) =>
    `<button type="button" class="chip${chosen.has(i) ? " on" : ""}" data-i="${i}" aria-pressed="${chosen.has(i)}">${c}</button>`).join("");


  const socials = SOCIAL.map(([name, url, svg]) =>
    `<a href="${url || waLink()}" target="_blank" rel="noopener" aria-label="${name}" title="${name}">${svg}</a>`).join("");
  document.getElementById("socials2").innerHTML = socials;

  document.querySelectorAll(".wa-link").forEach(a => a.href = waLink());
  document.getElementById("langBtn").textContent = lang === "pt" ? "EN" : "PT";
  updateBook();
  renderStatus();
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  const i = +b.dataset.i;
  chosen.has(i) ? chosen.delete(i) : chosen.add(i);
  b.classList.toggle("on");
  b.setAttribute("aria-pressed", chosen.has(i));
  updateBook();
});

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "pt" ? "en" : "pt";
  try { localStorage.setItem("phb-lang", lang); } catch (e) {}
  render();
});

render();
setInterval(renderStatus, 60000);
